name: Quality tools

on:
  push:
    branches: [main, '2.0']
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test
      - run: node scripts/validate-doc.js --all
      - run: node scripts/validate-doc.js --new-doc --strict doc/tech-docs/Lint_Doc_Language_Design.html
      - run: node scripts/check-doc-fidelity.js doc/tech-docs/Lint_Doc_Language_Design.md doc/tech-docs/Prose_Design.md doc/tech-docs/Quality_Report_Design.md doc/Quality_Tooling_System.md
      - run: node scripts/check-doc-links.js --strict doc/tech-docs/Lint_Doc_Language_Design.html doc/tech-docs/Prose_Design.html doc/tech-docs/Quality_Report_Design.html doc/Quality_Tooling_System.html
      - run: node scripts/lint-doc-language.js --strict doc/tech-docs/Lint_Doc_Language_Design.md doc/tech-docs/Lint_Doc_Language_Design.html
      - run: node scripts/lint-doc-language.js --strict SKILL.md references/authoring-workflow.md references/fullpower-workflow.md references/maintenance-workflow.md
