<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT_NAME}} — 技术指导文档</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">

  <style>
/* @sync:doc-shell.css:start */
/* ===== doc-shell.css — Shared CSS for all doc types ===== */
/* Warm-paper teal skin — off-white ground, teal accent, editorial restraint */

/* ===== CSS Variables ===== */
:root {
  --font-sans: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  --font-display: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  --font-mono: Consolas, "Courier New", "Fira Code", monospace;
  --line-height: 1.7;
  --max-width: 960px;
  --toc-width: 240px;
  --header-height: 48px;

  /* Light theme — Warm-paper Teal */
  --bg: #fafbfc;
  --bg-secondary: #f4f6f8;
  --bg-tertiary: #ebeef1;
  --text: #1a2332;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-faint: #94a3b8;
  --border: #d8dee4;
  --border-light: #e8ecf0;
  --accent: #1c8790;
  --accent-hover: #15696f;
  --accent-soft: #e7f8f7;
  --accent-light: #e7f8f7;
  --accent-green: #16a34a;
  --accent-green-light: #ecfdf5;
  --accent-orange: #b45309;
  --accent-orange-light: #fefce8;
  --accent-red: #dc2626;
  --accent-red-light: #fef2f2;
  --accent-purple: #7c3aed;
  --accent-purple-light: #f5f3ff;
  --code-bg: #f1f4f8;
  --code-border: #dce2e8;
  --link: #1a6fa0;
  --link-hover: #14587e;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,.06);
  --radius: 6px;
  --radius-lg: 8px;
  --radius-sm: 4px;

  /* Semantic callout colors */
  --info: #3b82f6;      --info-bg: #eff6ff;     --info-border: #bfdbfe;
  --success: #16a34a;   --success-bg: #edf7f0;  --success-border: #bbf0c9;
  --warning: #ca8a04;   --warning-bg: #fefce8;  --warning-border: #fde68a;
  --danger: #dc2626;    --danger-bg: #fef2f2;   --danger-border: #fecaca;
  --note: #7c3aed;      --note-bg: #f5f3ff;     --note-border: #ddd6fe;

  /* Card accent colors */
  --card-green: #16a34a;
  --card-amber: #ca8a04;
  --card-red: #dc2626;
  --card-violet: #7c3aed;
  --card-cyan: #0891b2;
  --card-blue: #3b82f6;
}

[data-theme="dark"] {
  --bg: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #1c2128;
  --text: #e6edf3;
  --text-secondary: #b1bac4;
  --text-muted: #8b949e;
  --text-faint: #6e7681;
  --border: #30363d;
  --border-light: #21262d;
  --accent: #58d5c9;
  --accent-hover: #79e0d7;
  --accent-soft: #122b2e;
  --accent-light: #122b2e;
  --accent-green: #3fb950;
  --accent-green-light: #0d2818;
  --accent-orange: #d29922;
  --accent-orange-light: #2a1f05;
  --accent-red: #f85149;
  --accent-red-light: #2d0d0d;
  --accent-purple: #a371f7;
  --accent-purple-light: #1a0d2e;
  --code-bg: #1c2128;
  --code-border: #30363d;
  --link: #58a6ff;
  --link-hover: #79b8ff;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);

  --info: #58a6ff;      --info-bg: #0d1d31;     --info-border: #1f4170;
  --success: #3fb950;   --success-bg: #0d2818;  --success-border: #1a4731;
  --warning: #d29922;   --warning-bg: #2a1f05;  --warning-border: #4b3a12;
  --danger: #f85149;    --danger-bg: #2d0d0d;   --danger-border: #5a1a1a;
  --note: #a371f7;      --note-bg: #1a0d2e;     --note-border: #3b2066;

  --card-green: #3fb950;
  --card-amber: #d29922;
  --card-red: #f85149;
  --card-violet: #a371f7;
  --card-cyan: #39d2c0;
  --card-blue: #58a6ff;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #1c2128;
    --text: #e6edf3; --text-secondary: #b1bac4; --text-muted: #8b949e; --text-faint: #6e7681;
    --border: #30363d; --border-light: #21262d;
    --accent: #58d5c9; --accent-hover: #79e0d7; --accent-soft: #122b2e; --accent-light: #122b2e;
    --accent-green: #3fb950; --accent-green-light: #0d2818;
    --accent-orange: #d29922; --accent-orange-light: #2a1f05;
    --accent-red: #f85149; --accent-red-light: #2d0d0d;
    --accent-purple: #a371f7; --accent-purple-light: #1a0d2e;
    --code-bg: #1c2128; --code-border: #30363d;
    --link: #58a6ff; --link-hover: #79b8ff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
    --info: #58a6ff; --info-bg: #0d1d31; --info-border: #1f4170;
    --success: #3fb950; --success-bg: #0d2818; --success-border: #1a4731;
    --warning: #d29922; --warning-bg: #2a1f05; --warning-border: #4b3a12;
    --danger: #f85149; --danger-bg: #2d0d0d; --danger-border: #5a1a1a;
    --note: #a371f7; --note-bg: #1a0d2e; --note-border: #3b2066;
    --card-green: #3fb950; --card-amber: #d29922; --card-red: #f85149;
    --card-violet: #a371f7; --card-cyan: #39d2c0; --card-blue: #58a6ff;
  }
}

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: var(--line-height);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--accent-soft); color: var(--accent-hover); }

/* ===== Top bar ===== */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 12px;
  height: var(--header-height);
  padding: 0 24px;
  background: rgba(250,251,252,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.topbar-brand { font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; font-size: 0.72rem; white-space: nowrap; }
.topbar-sep { color: var(--text-faint); }
.topbar-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
.topbar-actions { display: flex; gap: 6px; }
.topbar-btn,
.btn-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text-muted);
  cursor: pointer; font-size: 16px;
  transition: border-color .15s, color .15s;
}
.topbar-btn:hover,
.btn-icon:hover { border-color: var(--accent); color: var(--accent); }
.sidebar-toggle { display: none; }

/* ===== Layout ===== */
.layout { display: grid; grid-template-columns: var(--toc-width) 1fr; min-height: calc(100vh - var(--header-height)); }

/* ===== Sidebar TOC ===== */
.sidebar {
  position: sticky; top: var(--header-height);
  height: calc(100vh - var(--header-height));
  overflow-y: auto; padding: 20px 0 20px 20px;
  border-right: 1px solid var(--border);
  font-size: 13px; scrollbar-width: thin;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.toc-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 8px 20px 6px; }
.toc-list { list-style: none; margin: 0; padding: 0; }
.toc-list li { margin: 0; }
.toc-list a,
.toc-link {
  display: block; padding: 4px 12px 4px 10px;
  color: var(--text-muted); text-decoration: none;
  border-left: 2px solid transparent;
  border-radius: 0 4px 4px 0;
  transition: color .15s, border-color .15s, background .15s;
  line-height: 1.4;
}
.toc-list a:hover,
.toc-link:hover { color: var(--text); background: var(--bg-secondary); }
.toc-list a.active,
.toc-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.toc-list .toc-h3,
.toc-link.toc-h3 { padding-left: 24px; font-size: 12px; }

/* ===== Main content ===== */
.main-content,
.main { max-width: var(--max-width); margin: 0 auto; padding: 32px 40px 80px; }

/* ===== Document metadata header ===== */
.doc-meta { margin-bottom: 36px; }
.doc-version {
  display: inline-block; padding: 2px 10px; border-radius: 4px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 12px; font-weight: 700; letter-spacing: .03em;
}
.doc-meta h1 { margin: 12px 0 16px; font-size: 32px; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; }
.meta-grid {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 16px;
  margin: 0; padding: 14px 18px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-secondary); font-size: 14px;
}
.meta-grid dt { color: var(--text-muted); font-weight: 600; white-space: nowrap; }
.meta-grid dd { margin: 0; }

/* ===== Headings ===== */
h1, h2, h3, h4 { margin: 0; color: var(--text); line-height: 1.3; letter-spacing: -0.01em; }
h2 { margin: 48px 0 16px; padding-bottom: 8px; font-size: 22px; font-weight: 700; border-bottom: 1px solid var(--border); }
h3 { margin: 32px 0 12px; font-size: 17px; font-weight: 600; }
h4 { margin: 24px 0 8px; font-size: 15px; font-weight: 700; letter-spacing: 0; }
summary > h2, summary > h3 { display: inline; margin: 0; border: 0; padding: 0; }

/* ===== Paragraphs, lists, links ===== */
p { margin: 0 0 12px; }
ul, ol { margin: 6px 0 12px 20px; }
li { margin-bottom: 4px; font-size: 0.92rem; }
a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }

/* ===== Details / collapsible sections ===== */
details {
  margin: 24px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
details > summary {
  padding: 12px 18px;
  background: var(--bg-secondary);
  cursor: pointer; font-weight: 700; font-size: 18px;
  list-style: none; user-select: none;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before {
  content: "\25B8"; display: inline-block; width: 20px;
  color: var(--text-faint); transition: transform .15s;
}
details[open] > summary::before { transform: rotate(90deg); }
details > summary:hover { background: var(--bg-tertiary); }
details > .section-body { padding: 18px 20px; }

/* ===== Section (guide-style flat sections) ===== */
.section { padding: 40px 0 20px; border-bottom: 1px solid var(--border-light); }
.section:last-child { border-bottom: none; }
.section-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; margin-bottom: 16px;
  background: var(--bg-secondary); border: 1px solid var(--border-light);
  border-radius: 8px;
}
.section-header:hover { border-color: var(--accent); }
.section-header h2 { font-size: 1.3rem; font-weight: 700; margin: 0; flex: 1; letter-spacing: -0.01em; border: none; padding: 0; }
.section-badge {
  font-size: 0.72rem; font-weight: 600; padding: 2px 10px;
  border-radius: 10px; white-space: nowrap;
}
.badge-config { background: var(--accent-light); color: var(--accent); }
.badge-runtime { background: var(--accent-green-light); color: var(--accent-green); }
.badge-example { background: var(--accent-orange-light); color: var(--accent-orange); }
.section-title {
  font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 12px;
}
.section-title .icon {
  width: 36px; height: 36px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
}
.section-desc { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 24px; max-width: 700px; }
.section-body { padding: 4px 20px 20px; }
.section-body h3 { color: var(--accent); }

/* Guide-style collapsible sections */
details.section-block { margin: 0 0 4px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
details.section-block > summary {
  padding: 16px 20px; cursor: pointer; font-weight: 600; background: var(--bg-secondary);
  display: flex; align-items: center; gap: 10px; list-style: none;
}
details.section-block > summary::-webkit-details-marker { display: none; }
details.section-block > summary::before { content: '\25B6'; font-size: 0.7rem; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; }
details.section-block[open] > summary::before { transform: rotate(90deg); }
details.section-block > summary h2 { font-size: 1.3rem; font-weight: 700; margin: 0; display: inline; }

/* ===== Tabs (pure CSS, max 5) ===== */
.tabs { margin: 16px 0; }
.tabs > input[type="radio"] { display: none; }
.tab-bar { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 12px; }
.tab-bar label {
  padding: 8px 18px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s;
}
.tab-bar label:hover { color: var(--text); }
.tab-panel { display: none; }
.tabs > input:nth-of-type(1):checked ~ .tab-bar label:nth-of-type(1),
.tabs > input:nth-of-type(2):checked ~ .tab-bar label:nth-of-type(2),
.tabs > input:nth-of-type(3):checked ~ .tab-bar label:nth-of-type(3),
.tabs > input:nth-of-type(4):checked ~ .tab-bar label:nth-of-type(4),
.tabs > input:nth-of-type(5):checked ~ .tab-bar label:nth-of-type(5) {
  color: var(--accent); border-bottom-color: var(--accent);
}
.tabs > input:nth-of-type(1):checked ~ .tab-panel:nth-of-type(1),
.tabs > input:nth-of-type(2):checked ~ .tab-panel:nth-of-type(2),
.tabs > input:nth-of-type(3):checked ~ .tab-panel:nth-of-type(3),
.tabs > input:nth-of-type(4):checked ~ .tab-panel:nth-of-type(4),
.tabs > input:nth-of-type(5):checked ~ .tab-panel:nth-of-type(5) {
  display: block;
}

/* ===== Callouts ===== */
.callout {
  margin: 16px 0; padding: 14px 18px;
  border-radius: 8px; border-left: 4px solid;
  font-size: 14px; line-height: 1.6;
  display: flex; gap: 10px; align-items: flex-start;
}
.callout-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; }
.callout strong { display: block; margin-bottom: 4px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .08em; }
.callout.info    { background: var(--info-bg);    border-color: var(--info);    color: var(--text); }
.callout.success { background: var(--success-bg); border-color: var(--success); color: var(--text); }
.callout.warning { background: var(--warning-bg); border-color: var(--warning); color: var(--text); }
.callout.danger  { background: var(--danger-bg);  border-color: var(--danger);  color: var(--text); }
.callout.note    { background: var(--note-bg);    border-color: var(--note);    color: var(--text); }

/* ===== Card grid ===== */
.card-grid { display: grid; gap: 16px; margin: 16px 0; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card-grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.card-grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; transition: border-color 0.15s;
}
.card:hover { border-color: var(--accent); }
.card h4 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
.card p, .card li { font-size: 0.88rem; color: var(--text-secondary); }
.card ul { margin: 6px 0 0 18px; }
.card.accent-green { border-left: 3px solid var(--card-green); }
.card.accent-amber { border-left: 3px solid var(--card-amber); }
.card.accent-red { border-left: 3px solid var(--card-red); }
.card.accent-violet { border-left: 3px solid var(--card-violet); }
.card.accent-cyan { border-left: 3px solid var(--card-cyan); }
.card.accent-blue { border-left: 3px solid var(--card-blue); }
.card .stat-value { font-size: 28px; font-weight: 800; margin: 0; }
.card .stat-desc { font-size: 14px; margin: 0; }

/* ===== Table ===== */
.table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin: 12px 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th {
  background: var(--bg-tertiary); padding: 10px 16px; text-align: left;
  font-weight: 600; font-size: 0.78rem; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-muted);
  border-bottom: 1px solid var(--border); position: sticky; top: 0;
}
td { padding: 12px 16px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-secondary); }

/* ===== Code ===== */
code {
  font-family: var(--font-mono); background: var(--code-bg);
  padding: 1px 6px; border-radius: 4px; font-size: 0.88em;
}
.code-block {
  position: relative; background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: var(--radius); margin: 12px 0; overflow: hidden;
}
.code-block pre { padding: 16px 18px; overflow-x: auto; line-height: 1.6; margin: 0; }
.code-block code { background: none; padding: 0; font-size: 0.85rem; font-family: var(--font-mono); }
.code-block .lang-tag {
  position: absolute; top: 6px; right: 8px; font-size: 0.7rem; color: var(--text-muted);
  background: var(--bg-secondary); padding: 1px 8px; border-radius: 4px; opacity: 0; transition: opacity 0.15s;
}
.code-block:hover .lang-tag { opacity: 1; }
.code-block .copy-btn {
  position: absolute; top: 6px; right: 60px; font-size: 0.72rem; color: var(--text-muted);
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px;
  padding: 2px 8px; cursor: pointer; opacity: 0; transition: opacity 0.15s;
}
.code-block:hover .copy-btn { opacity: 1; }
.code-block .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
.code-block .copy-btn.copied { color: var(--accent-green); border-color: var(--accent-green); }
/* Manual syntax highlight spans (zero-dependency fallback) */
.code-block .cmt { color: var(--text-muted); }
.code-block .kw { color: var(--accent-purple); }
.code-block .fn { color: var(--accent); }
.code-block .str { color: var(--accent-green); }
.code-block .num { color: var(--accent-orange); }

/* ===== Diagram (ASCII art) ===== */
.diagram {
  background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; font-family: var(--font-mono); font-size: 0.82rem;
  line-height: 1.5; overflow-x: auto; white-space: pre; margin: 16px 0; color: var(--text);
  position: relative;
}
.diagram-hint {
  position: absolute; bottom: 8px; right: 12px; font-size: 0.7rem; color: var(--text-muted);
  opacity: 0; transition: opacity 0.2s;
}
.diagram:hover .diagram-hint { opacity: 0.7; }

/* ===== SVG Diagram (inline) ===== */
.diagram figure { margin: 0; }
.diagram svg { max-width: 100%; height: auto; }
figure.diagram {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
  padding: 20px; margin: 20px 0; text-align: center;
  cursor: zoom-in; position: relative;
  max-height: 500px; overflow: auto;
}
figure.diagram:hover { border-color: var(--accent); }
figure.diagram::after {
  content: '\70B9\51FB\653E\5927'; position: absolute;
  bottom: 6px; right: 10px; font-size: 12px;
  color: var(--text-faint); opacity: 0;
  transition: opacity 0.2s; pointer-events: none;
}
figure.diagram:hover::after { opacity: 1; }
figure.diagram figcaption { margin-top: 12px; font-size: 13px; color: var(--text-faint); font-style: italic; }
figure.diagram figcaption .fig-source,
.mermaid-wrap figcaption .fig-source {
  float: right; font-size: 11px; color: var(--text-muted); font-style: normal; font-weight: 400;
}

/* ===== Diagram Zoom Overlay ===== */
.diagram-overlay {
  display: none; position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85); z-index: 9999;
  cursor: grab; overflow: hidden;
}
.diagram-overlay.active { display: flex; align-items: center; justify-content: center; }
.diagram-overlay.grabbing { cursor: grabbing; }
.diagram-overlay-inner { transform-origin: center center; }
.diagram-overlay .zoom-controls {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; background: rgba(30,30,50,0.9);
  padding: 8px 16px; border-radius: 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 10000; user-select: none;
}
.diagram-overlay .zoom-controls button {
  background: rgba(255,255,255,0.1); border: none; color: #fff;
  width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.diagram-overlay .zoom-controls button:hover { background: rgba(255,255,255,0.25); }
.diagram-overlay .zoom-controls .zoom-level {
  color: #aaa; font-size: 13px; min-width: 50px; text-align: center; line-height: 36px;
}
.diagram-overlay .zoom-close {
  position: fixed; top: 16px; right: 20px;
  background: rgba(255,255,255,0.1); border: none; color: #fff;
  width: 40px; height: 40px; border-radius: 50%; font-size: 22px;
  cursor: pointer; z-index: 10000;
  display: flex; align-items: center; justify-content: center;
}
.diagram-overlay .zoom-close:hover { background: rgba(255,255,255,0.25); }
.diagram-overlay .zoom-hint {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.5); font-size: 13px; z-index: 10000; pointer-events: none;
}

/* ===== Mermaid diagram container ===== */
.mermaid-wrap {
  margin: 20px 0; padding: 20px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-secondary); text-align: center;
  overflow-x: auto; cursor: zoom-in; position: relative;
  min-height: 120px; max-height: 600px; overflow: auto;
}
.mermaid-wrap:hover { border-color: var(--accent); }
.mermaid-wrap::after {
  content: '\70B9\51FB\653E\5927'; position: absolute;
  bottom: 6px; right: 10px; font-size: 12px;
  color: var(--text-faint); opacity: 0;
  transition: opacity 0.2s; pointer-events: none;
}
.mermaid-wrap:hover::after { opacity: 1; }
.mermaid-wrap .mermaid { display: inline-block; max-width: 100%; }
.mermaid-wrap figcaption { margin-top: 12px; font-size: 13px; color: var(--text-faint); font-style: italic; }
.mermaid-loading { padding: 40px; color: var(--text-faint); font-size: 14px; }

/* ===== Flow ===== */
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
.flow-step {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px; text-align: center; flex: 1; min-width: 100px;
  position: relative;
}
.flow-step b { display: block; font-size: 0.82rem; color: var(--accent); margin-bottom: 2px; }
.flow-step span { font-size: 0.78rem; color: var(--text-secondary); }
.flow-arrow { color: var(--text-muted); font-size: 1rem; flex-shrink: 0; }

/* Flow vertical variant */
.flow.flow-vertical { flex-direction: column; align-items: stretch; max-width: 480px; }
.flow.flow-vertical .flow-step { flex: none; min-width: auto; }
.flow.flow-vertical .flow-arrow { text-align: center; transform: none; }

/* Flow branch node */
.flow-step.flow-branch { border-color: var(--accent); border-style: dashed; }
.flow-step.flow-branch b { color: var(--accent); }
.flow-step.flow-branch .branch-yes,
.flow-step.flow-branch .branch-no {
  display: block; font-size: 0.75rem; margin-top: 4px; padding: 2px 0;
}
.flow-step.flow-branch .branch-yes { color: var(--accent-green); }
.flow-step.flow-branch .branch-no { color: var(--accent-red); }

/* ===== Layer Stack ===== */
.layer-stack { display: flex; flex-direction: column; gap: 4px; margin: 16px 0; }
.layer {
  padding: 14px 18px; border-radius: var(--radius); font-weight: 600; font-size: 0.9rem;
  display: flex; align-items: center; gap: 12px;
}
.layer .layer-label { font-size: 0.75rem; opacity: 0.7; font-weight: 400; }
.layer.app { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); }
.layer.core { background: var(--accent-purple-light); border: 1px solid var(--accent-purple); color: var(--accent-purple); }
.layer.infra { background: var(--accent-orange-light); border: 1px solid var(--accent-orange); color: var(--accent-orange); }
.layer.hw { background: var(--accent-green-light); border: 1px solid var(--accent-green); color: var(--accent-green); }

/* ===== Step Indicators ===== */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 16px 0; }
.step {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 16px 16px 52px; position: relative;
}
.step::before {
  content: attr(data-step); position: absolute; left: 14px; top: 16px;
  width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
  font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.step h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
.step p { font-size: 0.82rem; color: var(--text-secondary); margin: 0; }

/* ===== Prerequisite Box ===== */
.prereq {
  background: var(--bg-secondary); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius); padding: 16px 18px; margin: 14px 0;
}
.prereq h4 { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.prereq ul { margin: 0 0 0 18px; }
.prereq li { font-size: 0.88rem; color: var(--text-secondary); }

/* ===== Dependency Tree ===== */
.dep-tree {
  background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; font-family: var(--font-mono); font-size: 0.85rem;
  line-height: 1.6; overflow-x: auto; white-space: pre; margin: 12px 0; color: var(--text);
}

/* ===== Details (FAQ) ===== */
details.faq { margin: 8px 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
details.faq summary {
  padding: 12px 16px; cursor: pointer; font-weight: 600; background: var(--bg-secondary);
  display: flex; align-items: center; gap: 8px; list-style: none; font-size: 0.92rem;
}
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::before { content: '\25B6'; font-size: 0.65rem; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; }
details.faq[open] summary::before { transform: rotate(90deg); }
details.faq > div { padding: 12px 16px; font-size: 0.88rem; color: var(--text-secondary); }

/* ===== Feature List ===== */
.feature-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.feature-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
  background: var(--bg-secondary); border-radius: var(--radius); font-size: 0.88rem;
}
.feature-item .check { color: var(--accent-green); font-weight: bold; flex-shrink: 0; margin-top: 2px; }

/* ===== Tag / Badge ===== */
.tag {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 0.75rem; font-weight: 600; margin-top: 10px;
}

/* ===== Changelog ===== */
.changelog { list-style: none; padding: 0; margin: 16px 0; }
.changelog li { padding: 8px 0; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px; }
.changelog li:last-child { border-bottom: none; }
.changelog time { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

/* ===== Source Reference (Phase 2) ===== */
.source-ref {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--link); font-size: 0.85em; text-decoration: none;
  border-bottom: 1px dashed var(--link); transition: all 0.15s;
}
.source-ref:hover { color: var(--link-hover); border-bottom-style: solid; text-decoration: none; }
.source-ref code { background: none; padding: 0; font-size: 0.85em; }

.relevant-sources {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 18px; margin: 16px 0;
}
.relevant-sources h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
.relevant-sources ul { margin: 0; padding: 0; list-style: none; }
.relevant-sources li { padding: 4px 0; font-size: 0.88rem; }

.sources-block {
  margin: 16px 0 8px; padding: 8px 12px;
  border-top: 1px solid var(--border-light);
  font-size: 0.82rem; color: var(--text-muted);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.sources-label { font-weight: 600; color: var(--text-faint); }

/* ===== Scope Block (Phase 4) ===== */
.scope-block {
  background: var(--info-bg); border-left: 3px solid var(--info);
  padding: 12px 16px; border-radius: var(--radius); margin-bottom: 20px;
  font-size: 0.9rem;
}

/* ===== Anchor offset ===== */
[id] { scroll-margin-top: calc(var(--header-height) + 16px); }

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: var(--header-height); left: 0; width: 280px;
    height: calc(100vh - var(--header-height)); z-index: 99; transform: translateX(-100%);
    transition: transform 0.25s ease; box-shadow: var(--shadow-md);
    background: var(--bg);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: flex; }
  .main-content, .main { padding: 24px 20px 40px; }
  .card-grid, .card-grid.cols-2, .card-grid.cols-3 { grid-template-columns: 1fr; }
  .flow:not(.flow-vertical) { flex-direction: column; }
  .flow:not(.flow-vertical) .flow-arrow { transform: rotate(90deg); }
  .steps { grid-template-columns: 1fr; }
}

/* ===== Dark topbar backdrop ===== */
[data-theme="dark"] .topbar { background: rgba(13,17,23,0.88); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .topbar { background: rgba(13,17,23,0.88); }
}

/* ===== Mermaid dark mode ===== */
[data-theme="dark"] .mermaid-wrap { background: var(--bg-tertiary); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .mermaid-wrap { background: var(--bg-tertiary); }
}

/* ===== Diagram copy button (moved from inline style #19) ===== */
.has-copy-btn { position: relative; }
.diagram-copy-btn {
  position: absolute; top: 8px; right: 8px;
  font-size: 0.72rem; color: var(--text-muted);
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 8px; cursor: pointer;
  opacity: 0; transition: opacity 0.15s;
}
.diagram-copy-btn.visible { opacity: 1; }

/* ===== Footer ===== */
.doc-footer {
  text-align: center; padding: 40px 24px;
  color: var(--text-muted); font-size: 0.82rem;
  border-top: 1px solid var(--border);
}
.doc-footer p + p { margin-top: 6px; }

/* ===== Print ===== */
@media print {
  .topbar, .sidebar, .copy-btn, .lang-tag, .diagram-hint { display: none !important; }
  .layout { grid-template-columns: 1fr; }
  .main-content, .main { max-width: 100%; padding: 0; }
  .section { page-break-inside: avoid; }
  details, details.section-block, details.faq { break-inside: avoid; }
  details[open] > summary + * { break-inside: avoid; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.8em; color: var(--text-muted); }
}
/* @sync:doc-shell.css:end */
/* === Template-specific overrides === */
.hero {
  background: var(--bg-tertiary); color: var(--text);
  padding: 60px 24px 50px; text-align: center;
  border-bottom: 1px solid var(--border);
}
.hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -.02em; }
.hero p { max-width: 600px; margin: 0 auto 12px; color: var(--text-secondary); font-size: 1.05rem; }
.hero .meta { font-size: 0.82rem; color: var(--text-muted); }
  </style>
</head>
<body>

<!-- ===== Hero ===== -->
<header class="hero">
  <h1>{{PROJECT_NAME}}</h1>
  <p>{{PROJECT_DESC}}</p>
  <div class="meta">{{PROJECT_META}}</div>
</header>

<!-- ===== Topbar ===== -->
<div class="topbar">
  <button class="btn-icon sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">&#9776;</button>
  <span class="topbar-brand">{{PROJECT_NAME}}</span>
  <span class="topbar-sep">/</span>
  <span class="topbar-title">技术指导文档</span>
  <div class="topbar-actions">
    <button class="btn-icon" onclick="toggleTheme()" aria-label="Toggle theme" title="切换主题">&#9681;</button>
  </div>
</div>

<!-- ===== Layout ===== -->
<div class="layout">

<!-- ===== Sidebar ===== -->
<aside class="sidebar" id="sidebar">
  <div class="toc-title">目录</div>
  <nav id="toc"></nav>
</aside>

<!-- ===== Main Content ===== -->
<main class="main-content">

{{SECTIONS}}

</main>
</div>

<!-- ===== Footer ===== -->
<footer class="doc-footer">
  <p>{{PROJECT_NAME}} — 技术指导文档</p>
  <p>{{PROJECT_META}}</p>
</footer>

<!-- ===== CDN: highlight.js + Mermaid ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>

<!-- ===== Script ===== -->
<script>
/* @sync:doc-shell.js:start */
/* ===== doc-shell.js — Shared JS for all doc types ===== */
/* Shared interactive features for all doc-writer document types */
(function() {
  'use strict';

  var root = document.documentElement;

  // --- Theme: 3-layer (localStorage > OS preference > default light) ---
  var savedTheme = localStorage.getItem('doc-theme');
  if (savedTheme) {
    root.setAttribute('data-theme', savedTheme);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    root.setAttribute('data-theme', 'dark');
  }

  function currentThemeIsDark() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  window.toggleTheme = function() {
    var current = root.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('doc-theme', next);
    rerenderMermaid(next === 'dark');
  };

  // --- Mobile sidebar toggle ---
  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('open');
  };

  function closeSidebarOnMobile() {
    if (window.innerWidth <= 900) {
      document.getElementById('sidebar').classList.remove('open');
    }
  }

  // --- TOC auto-generation ---
  function slugify(text) {
    return text.trim().toLowerCase()
      .replace(/[\s]+/g, '-')
      .replace(/[^\w一-鿿-]/g, '')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
  }

  function buildTOC() {
    var toc = document.getElementById('toc');
    if (!toc) return;

    // Determine TOC container type: <nav> (guide) or <ul.toc-list> (module/system)
    var isNav = toc.tagName === 'NAV';
    var container = isNav ? toc : toc.querySelector('ul') || toc;

    var items = [];

    // Collect H2 from flat sections and collapsible sections
    document.querySelectorAll(
      '.section[id] > .section-title, ' +
      '.section[id] > .section-header h2, ' +
      'details.section-block[id] > summary h2, ' +
      'details[id] > summary h2'
    ).forEach(function(el) {
      var section = el.closest('[id]');
      if (!section) return;
      items.push({ id: section.id, text: el.textContent.trim(), level: 2 });
    });

    // Collect H3 with ids
    document.querySelectorAll('.section[id] h3[id], .section-body h3[id], details.section-block[id] h3[id], details[id] h3[id]').forEach(function(el) {
      items.push({ id: el.id, text: el.textContent.trim(), level: 3 });
    });

    // Auto-generate ids for H3 without ids
    document.querySelectorAll('.section h3:not([id]), .section-body h3:not([id])').forEach(function(el) {
      var id = slugify(el.textContent);
      if (id && !document.getElementById(id)) {
        el.id = id;
        items.push({ id: id, text: el.textContent.trim(), level: 3 });
      }
    });

    // Build HTML
    if (isNav) {
      // Guide-style: flat <a> links
      var html = '';
      items.forEach(function(item) {
        var cls = item.level === 3 ? 'toc-link toc-h3' : 'toc-link';
        html += '<a class="' + cls + '" href="#' + item.id + '">' + item.text + '</a>';
      });
      container.innerHTML = html;
    } else {
      // Module/system-style: <ul><li><a>
      container.innerHTML = '';
      items.forEach(function(item) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + item.id;
        a.textContent = item.text;
        if (item.level === 3) a.classList.add('toc-h3');
        a.addEventListener('click', function(e) {
          e.preventDefault();
          var target = document.getElementById(item.id);
          if (target) {
            var details = target.closest('details');
            if (details && !details.open) details.open = true;
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          closeSidebarOnMobile();
        });
        li.appendChild(a);
        container.appendChild(li);
      });
    }

    // Close sidebar on mobile after click
    container.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        closeSidebarOnMobile();
      });
    });
  }

  // --- ScrollSpy ---
  function setupScrollSpy() {
    var links = document.querySelectorAll('.toc-link, .toc-list a');
    if (!links.length) return;

    var targets = [];
    links.forEach(function(link) {
      var id = link.getAttribute('href');
      if (!id) return;
      id = id.slice(1);
      var el = document.getElementById(id);
      if (el) targets.push({ el: el, link: link });
    });

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          links.forEach(function(l) { l.classList.remove('active'); });
          var match = targets.find(function(t) { return t.el === entry.target; });
          if (match) match.link.classList.add('active');
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px', threshold: 0 });

    targets.forEach(function(t) { observer.observe(t.el); });
  }

  // --- Code highlighting + copy buttons ---
  function setupCodeBlocks() {
    document.querySelectorAll('.code-block').forEach(function(block) {
      // Inject copy button
      if (!block.querySelector('.copy-btn')) {
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', function() {
          var code = block.querySelector('code');
          if (code && navigator.clipboard) {
            navigator.clipboard.writeText(code.textContent).then(function() {
              btn.textContent = '✓';
              btn.classList.add('copied');
              setTimeout(function() {
                btn.textContent = 'Copy';
                btn.classList.remove('copied');
              }, 1500);
            });
          }
        });
        block.appendChild(btn);
      }

      // Inject language tag
      var code = block.querySelector('code');
      if (code && !block.querySelector('.lang-tag')) {
        var lang = code.className.match(/language-(\w+)/);
        if (!lang) {
          lang = (block.getAttribute('data-lang') || '').match(/^(\w+)$/);
        }
        if (lang) {
          var tag = document.createElement('span');
          tag.className = 'lang-tag';
          tag.textContent = lang[1];
          block.appendChild(tag);
        }
      }
    });

    // highlight.js
    if (typeof hljs !== 'undefined') {
      document.querySelectorAll('.code-block pre code').forEach(function(el) {
        var lang = el.closest('.code-block') ? el.closest('.code-block').getAttribute('data-lang') : null;
        if (lang && hljs.getLanguage(lang)) {
          el.className = 'hljs language-' + lang;
          hljs.highlightElement(el);
        } else {
          hljs.highlightElement(el);
        }
      });
    }
  }

  // --- Diagram copy buttons (ASCII art) ---
  function setupDiagramCopy() {
    document.querySelectorAll('.diagram').forEach(function(block) {
      if (block.querySelector('svg')) return; // Skip SVG diagrams
      if (block.querySelector('.copy-btn')) return;

      var btn = document.createElement('button');
      btn.className = 'copy-btn diagram-copy-btn';
      btn.textContent = 'Copy';
      block.classList.add('has-copy-btn');
      block.onmouseenter = function() { btn.classList.add('visible'); };
      block.onmouseleave = function() { btn.classList.remove('visible'); };
      btn.onclick = function() {
        var text = block.textContent.replace('Copy', '').replace(/✓/g, '').trim();
        navigator.clipboard.writeText(text).then(function() {
          btn.textContent = '✓';
          setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
        });
      };
      block.appendChild(btn);
    });
  }

  // --- Diagram Zoom (SVG click to fullscreen) ---
  function setupDiagramZoom() {
    var existingOverlay = document.querySelector('.diagram-overlay');
    if (existingOverlay) return; // Already set up

    var overlay = document.createElement('div');
    overlay.className = 'diagram-overlay';
    overlay.innerHTML =
      '<button class="zoom-close" title="关闭 (Esc)">&times;</button>' +
      '<span class="zoom-hint">滚轮缩放 · 拖拽平移 · 点击空白处关闭</span>' +
      '<div class="diagram-overlay-inner"></div>' +
      '<div class="zoom-controls">' +
      '<button class="zoom-out" title="缩小">−</button>' +
      '<span class="zoom-level">100%</span>' +
      '<button class="zoom-in" title="放大">+</button>' +
      '<button class="zoom-reset" title="重置">⟲</button>' +
      '</div>';
    document.body.appendChild(overlay);

    var inner = overlay.querySelector('.diagram-overlay-inner');
    var zoomLevelEl = overlay.querySelector('.zoom-level');
    var scale = 1, panX = 0, panY = 0, isDragging = false, dragX, dragY;
    var MIN = 0.2, MAX = 5;

    function update() {
      inner.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
      zoomLevelEl.textContent = Math.round(scale * 100) + '%';
    }
    function reset() { scale = 1; panX = 0; panY = 0; update(); }
    function close() {
      overlay.classList.remove('active');

    }

    document.addEventListener('click', function(e) {
      var diagram = e.target.closest('figure.diagram, .mermaid-wrap');
      if (!diagram || overlay.classList.contains('active')) return;
      var svg = diagram.querySelector('svg');
      if (!svg) return;
      inner.innerHTML = '';

      clone.style.maxWidth = 'none';
      var vb = clone.getAttribute('viewBox');
      if (vb) { var p = vb.split(/[\s,]+/); clone.style.width = (parseInt(p[2]) || 700) + 'px'; }

      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
      setTimeout(function() {
        var r = clone.getBoundingClientRect();
        var vw = window.innerWidth * 0.9, vh = window.innerHeight * 0.8;

    overlay.addEventListener('click', function(e) {

      if (e.key === 'Escape' && overlay.classList.contains('active')) close();

    overlay.querySelector('.zoom-in').addEventListener('click', function(e) {
      e.stopPropagation(); scale = Math.min(MAX, scale * 1.25); update();
    });
    overlay.querySelector('.zoom-out').addEventListener('click', function(e) {
      e.stopPropagation(); scale = Math.max(MIN, scale / 1.25); update();
    });
    overlay.querySelector('.zoom-reset').addEventListener('click', function(e) {
      e.stopPropagation(); reset();
    });
